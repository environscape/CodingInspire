<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Inspire Modular | Article</title>
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style id="inline-css">:root {
  --primary-color: #ffffff;
  --secondary-color: #f5f5f5;
  --accent-color: #ff6b35;
  --accent-hover: #ff8c5a;
  --text-primary: #1a1a1a;
  --text-secondary: #666666;
  --text-muted: #999999;
  --bg-primary: #ffffff;
  --bg-secondary: #fafafa;
  --bg-card: #ffffff;
  --border-color: #e0e0e0;
  --transition-fast: 0.2s ease;
  --transition-normal: 0.3s ease;
  --transition-slow: 0.5s ease;
}

:root.dark-theme {
  --primary-color: #1a1a1a;
  --secondary-color: #2a2a2a;
  --accent-color: #ff6b35;
  --accent-hover: #ff8c5a;
  --text-primary: #ffffff;
  --text-secondary: #a0a0a0;
  --text-muted: #666666;
  --bg-primary: #0d0d0d;
  --bg-secondary: #141414;
  --bg-card: #1a1a1a;
  --border-color: #2a2a2a;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  background-color: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background-color: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  z-index: 1000;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 32px;
  border-bottom: 1px solid rgba(0, 0, 0, 0.05);
  transition: all var(--transition-normal);
}

nav.scrolled {
  background-color: rgba(255, 255, 255, 0.95);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
}

:root.dark-theme nav {
  background-color: rgba(13, 13, 13, 0.9);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

:root.dark-theme nav.scrolled {
  background-color: rgba(13, 13, 13, 0.95);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
}

.logo {
  height: 48px;
  width: auto;
  transition: transform var(--transition-fast);
}

.logo:hover {
  transform: scale(1.05);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 32px;
}

.nav-links a {
  text-decoration: none;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.5px;
  position: relative;
  transition: color var(--transition-fast);
  text-transform: uppercase;
}

.nav-links a:hover,
.nav-links a.active {
  color: var(--text-primary);
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -6px;
  left: 0;
  width: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent-color), var(--accent-hover));
  transition: width var(--transition-normal);
}

.nav-links a:hover::after,
.nav-links a.active::after {
  width: 100%;
}

.theme-toggle {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 8px;
  border-radius: 50%;
  transition: all var(--transition-fast);
  display: flex;
  align-items: center;
  justify-content: center;
}

.theme-toggle:hover {
  color: var(--text-primary);
  background: rgba(0, 0, 0, 0.05);
  transform: rotate(15deg);
}

:root.dark-theme .theme-toggle:hover {
  background: rgba(255, 255, 255, 0.1);
}

.lang-toggle {
  background: transparent;
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  cursor: pointer;
  padding: 6px 14px;
  border-radius: 50px;
  font-size: 13px;
  font-weight: 500;
  transition: all var(--transition-fast);
  display: flex;
  align-items: center;
  gap: 6px;
}

.lang-toggle:hover {
  color: var(--text-primary);
  border-color: var(--accent-color);
  background: rgba(255, 107, 53, 0.05);
}

:root.dark-theme .lang-toggle:hover {
  background: rgba(255, 107, 53, 0.1);
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-shrink: 0;
}

.menu-icon {
  display: none;
  cursor: pointer;
  color: var(--text-primary);
}

.back-link {
  max-width: 880px; margin: 0 auto; padding: 112px 40px 0;
}
.back-link a {
  color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; transition: color var(--transition-fast);
}
.back-link a:hover { color: var(--accent-color); }

.article { max-width: 880px; margin: 0 auto; padding: 24px 40px 80px; }
.article-header { margin-bottom: 32px; }
.article-header .meta {
  display: flex; gap: 12px; margin-bottom: 16px;
  font-size: 13px; color: var(--text-muted); flex-wrap: wrap;
}
.article-header .meta .tag {
  background: var(--secondary-color); color: var(--accent-color);
  padding: 3px 12px; border-radius: 14px; font-weight: 500;
}
.article-header h1 {
  font-size: 38px; font-weight: 700; line-height: 1.25;
  margin-bottom: 16px;
}
.article-header p.summary {
  font-size: 17px; color: var(--text-secondary); line-height: 1.7;
}

.carousel {
  position: relative; border-radius: 12px; overflow: hidden;
  background: var(--bg-secondary); margin-bottom: 40px;
}
.carousel-main { width: 100%; aspect-ratio: 16/9; }
.carousel-main img { width: 100%; height: 100%; object-fit: cover; display: block; }
.carousel-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(0,0,0,0.5); border: none; color: #fff;
  width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
  font-size: 22px; display: flex; align-items: center; justify-content: center;
  transition: background var(--transition-fast);
}
.carousel-nav:hover { background: rgba(0,0,0,0.75); }
.carousel-prev { left: 16px; }
.carousel-next { right: 16px; }
.carousel-dots {
  position: absolute; bottom: 14px; left: 0; right: 0;
  display: flex; justify-content: center; gap: 8px;
}
.carousel-dots button {
  width: 10px; height: 10px; border-radius: 50%; border: none;
  background: rgba(255,255,255,0.5); cursor: pointer; padding: 0;
  transition: background var(--transition-fast);
}
.carousel-dots button.active { background: #fff; width: 24px; border-radius: 5px; }
.carousel-thumbs {
  display: flex; gap: 10px; margin-top: 12px; overflow-x: auto; padding-bottom: 4px;
}
.carousel-thumbs button {
  flex: 0 0 80px; aspect-ratio: 1; border: 2px solid transparent;
  border-radius: 6px; overflow: hidden; padding: 0; cursor: pointer;
  transition: border-color var(--transition-fast);
}
.carousel-thumbs button.active { border-color: var(--accent-color); }
.carousel-thumbs img { width: 100%; height: 100%; object-fit: cover; }

.article-body { font-size: 16px; color: var(--text-primary); }
.article-body p { margin-bottom: 18px; line-height: 1.8; }
.article-body h2 {
  font-size: 24px; font-weight: 600; margin: 32px 0 14px;
  color: var(--text-primary);
}
.article-body h3 {
  font-size: 20px; font-weight: 600; margin: 24px 0 12px;
}
.article-body ul, .article-body ol { padding-left: 24px; margin-bottom: 18px; }
.article-body li { margin-bottom: 6px; }
.article-body a { color: var(--accent-color); text-decoration: none; }
.article-body a:hover { text-decoration: underline; }

.article-loading, .article-error {
  text-align: center; padding: 100px 0; color: var(--text-muted); font-size: 16px;
}
.article-error a { color: var(--accent-color); text-decoration: underline; }

.brand-introduction {
  padding: 100px 40px;
  background: linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
  text-align: center;
  max-width: 1200px;
  margin: 0 auto;
}
.brand-introduction h5 {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 24px;
  color: var(--text-primary);
}
.brand-introduction p {
  font-size: 16px;
  color: var(--text-secondary);
  line-height: 2;
  margin-bottom: 32px;
}
.friend-links {
  background: var(--secondary-color); padding: 60px 40px; text-align: center;
}
.friend-links .links-row { display: flex; justify-content: center; gap: 40px; margin-bottom: 30px; flex-wrap: wrap; }
.friend-links a { color: var(--text-secondary); text-decoration: none; font-weight: 500; transition: color var(--transition-fast); }
.friend-links a:hover { color: var(--accent-color); }
.qr-code-container { display: flex; justify-content: center; gap: 40px; margin-bottom: 30px; flex-wrap: wrap; }
.qr-code-wrapper img { width: 100px; height: 100px; object-fit: contain; border-radius: 8px; background: #fff; }
.qr-code-wrapper p { margin-top: 8px; color: var(--text-secondary); font-size: 13px; }
.copyright { color: var(--text-muted); font-size: 13px; }

@media (max-width: 768px) {
  nav {
    padding: 12px 20px;
  }

  .logo {
    height: 36px;
  }

  .nav-links {
    display: none;
    position: absolute;
    top: 100%;
    right: 20px;
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 12px;
    border: 1px solid var(--border-color);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    min-width: 160px;
    overflow: hidden;
    z-index: 1001;
    animation: dropdownFade 0.2s ease;
  }

  .nav-links.active {
    display: flex;
    flex-direction: column;
    padding: 8px 0;
    gap: 0;
  }

  @keyframes dropdownFade {
    from {
      transform: translateY(-10px);
      opacity: 0;
    }
    to {
      transform: translateY(0);
      opacity: 1;
    }
  }

  .nav-links a {
    padding: 12px 20px;
    margin: 0;
    text-transform: none;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-secondary);
    border-bottom: none;
    transition: all var(--transition-fast);
  }

  .nav-links a:hover,
  .nav-links a.active {
    color: var(--accent-color);
    background-color: rgba(255, 107, 53, 0.05);
  }

  .nav-links a::after {
    display: none;
  }

  .menu-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    transition: all var(--transition-fast);
    cursor: pointer;
  }

  .menu-icon:hover {
    background: var(--accent-color);
    border-color: var(--accent-color);
    color: white;
  }

  .back-link { padding: 96px 20px 0; }
  .article { padding: 16px 20px 60px; }
  .article-header h1 { font-size: 26px; }
  .article-header p.summary { font-size: 15px; }
  .carousel-nav { width: 36px; height: 36px; font-size: 18px; }
  .carousel-prev { left: 10px; } .carousel-next { right: 10px; }
  .brand-introduction { padding: 60px 20px; }
  .brand-introduction h5 { font-size: 20px; }
  .friend-links .links-row { gap: 24px; }
}
</style>
</head>
<body>
    <nav onclick="handleNavClick(event)">
        <a href="news.html">
            <img src="codinginspire.png" alt="品牌Logo" class="logo">
        </a>
        <div class="nav-right">
            <div class="nav-links" id="navLinks">
                <a href="index.html" data-i18n="nav_eurorack">Eurorack</a>
                <a href="instrument.html" data-i18n="nav_instrument">Instrument</a>
                <a href="news.html" class="active" data-i18n="nav_news">News</a>
                <a href="support.html" data-i18n="nav_support">Support</a>
            </div>
            <button class="lang-toggle" id="langToggle" onclick="toggleLang()" title="切换语言">EN</button>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
            <div class="menu-icon" id="menuIcon" onclick="toggleMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </div>
        </div>
    </nav>

    <div id="articleContainer">
        <div class="article-loading" data-i18n="loading">加载中...</div>
    </div>

    <div class="brand-introduction" id="brandIntro">
        <h5>Coding Inspire Modular | 编码灵感模块化</h5>
        <p>以创新技术重塑声音创作的边界，通过精妙的硬件架构和调配机制，赋予模块强大的工作流与多面性。产品皆为灵活的声音工具，既能独立承担核心功能，亦可通过参数组合与模式切换，适配多样化的创作场景。以极简形态承载丰富可能性，借助便捷的连接与多样的方式，即可轻松编织模块网络，让灵感顺畅转化为音乐实验。以技术打破创作枷锁，让模块化回归纯粹的艺术表达。</p>
    </div>

    <div class="friend-links">
        <div class="links-row" id="friendLinksRow"></div>
        <div class="qr-code-container">
            <div class="qr-code-wrapper">
                <img src="tb_qrcode.png" alt="淘宝店铺">
                <p data-i18n="qr_taobao">淘宝店铺</p>
            </div>
            <div class="qr-code-wrapper">
                <img src="qrcode.png" alt="手机扫码查看">
                <p data-i18n="qr_mobile">手机扫码查看</p>
            </div>
        </div>
        <div class="copyright">© 2023 - 2026 Coding Inspire Modular</div>
    </div>

<script>
    let currentLang = 'zh';
    let friendLinksCache = null;
    let allArticles = [];
    let currentArticle = null;
    let carouselIndex = 0;

    const translations = {
        en: {
            loading: 'Loading...', back_to_news: '← Back to News', read_more: 'Read more →',
            article_not_found: 'Article not found.', back_to_news_link: 'Return to News page'
        },
        zh: {
            loading: '加载中...', back_to_news: '← 返回资讯列表', read_more: '阅读全文 →',
            article_not_found: '未找到该文章。', back_to_news_link: '返回资讯列表'
        }
    };

    let sharedTranslations = null;

    async function loadSharedTranslations() {
        if (!sharedTranslations) {
            const res = await fetch('data/translations.json');
            sharedTranslations = await res.json();
            Object.assign(translations.en, sharedTranslations.en);
            Object.assign(translations.zh, sharedTranslations.zh);
        }
    }

    function tField(obj, field) {
        if (currentLang === 'en' && obj[field + '_en']) return obj[field + '_en'];
        return obj[field];
    }

    function formatDate(dateStr) {
        const d = new Date(dateStr);
        if (currentLang === 'en') {
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }
        return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
    }

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('lang', lang);
        document.getElementById('langToggle').textContent = lang === 'zh' ? 'EN' : '中文';
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang] && translations[lang][key]) el.textContent = translations[lang][key];
        });
        const brandIntro = document.getElementById('brandIntro');
        if (brandIntro) {
            brandIntro.innerHTML = `
                <h5>${translations[lang].brand_title}</h5>
                <p>${translations[lang].brand_desc}</p>
            `;
        }
        if (currentArticle) renderArticle();
        loadFriendLinks();
    }
    function toggleLang() { setLanguage(currentLang === 'zh' ? 'en' : 'zh'); }
    function initLanguage() { setLanguage(localStorage.getItem('lang') || 'zh'); }
    function toggleTheme() {
            const root = document.documentElement;
            const themeToggle = document.getElementById('themeToggle');
            const logo = document.querySelector('.logo');
            if (root.classList.contains('dark-theme')) {
                root.classList.remove('dark-theme');
                localStorage.setItem('theme', 'light');
                themeToggle.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                `;
                if (logo) logo.src = 'codinginspire.png';
            } else {
                root.classList.add('dark-theme');
                localStorage.setItem('theme', 'dark');
                themeToggle.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                `;
                if (logo) logo.src = 'codinginspire_black.png';
            }
        }

        function initTheme() {
            const root = document.documentElement;
            const themeToggle = document.getElementById('themeToggle');
            const logo = document.querySelector('.logo');
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                root.classList.add('dark-theme');
                themeToggle.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                `;
                if (logo) logo.src = 'codinginspire_black.png';
            } else {
                root.classList.remove('dark-theme');
                themeToggle.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                `;
                if (logo) logo.src = 'codinginspire.png';
            }
        }

        function handleNavClick(event) {
            const target = event.target;
            if (!target.closest('a') && !target.closest('button') && !target.closest('.menu-icon')) {
                toggleTheme();
            }
        }

        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            navLinks.classList.toggle('active');
        }

    function renderArticle() {
        const container = document.getElementById('articleContainer');
        const a = currentArticle;
        const title = tField(a, 'title');
        const summary = tField(a, 'summary');
        const content = tField(a, 'content');
        const images = a.images && a.images.length ? a.images : [a.cover];
        carouselIndex = 0;

        document.title = title + ' | Coding Inspire Modular';

        const isMultiImage = images.length > 1;
        const thumbsHtml = isMultiImage ? `
            <div class="carousel-thumbs">
                ${images.map((img, i) => `<button class="${i === 0 ? 'active' : ''}" onclick="goSlide(${i})"><img src="${img}" alt=""></button>`).join('')}
            </div>` : '';
        const dotsHtml = isMultiImage ? `
            <div class="carousel-dots">
                ${images.map((_, i) => `<button class="${i === 0 ? 'active' : ''}" onclick="goSlide(${i})" aria-label="slide ${i + 1}"></button>`).join('')}
            </div>` : '';
        const navHtml = isMultiImage ? `
            <button class="carousel-nav carousel-prev" onclick="prevSlide()" aria-label="Previous">‹</button>
            <button class="carousel-nav carousel-next" onclick="nextSlide()" aria-label="Next">›</button>` : '';

        container.innerHTML = `
            <div class="back-link"><a href="news.html">${translations[currentLang].back_to_news}</a></div>
            <article class="article">
                <header class="article-header">
                    <div class="meta">
                        <span>${formatDate(a.date)}</span>
                        ${a.tags ? a.tags.map(t => `<span class="tag">${t}</span>`).join('') : ''}
                    </div>
                    <h1>${title}</h1>
                    <p class="summary">${summary}</p>
                </header>
                <div class="carousel">
                    <div class="carousel-main" id="carouselMain">
                        <img src="${images[0]}" alt="${title}" id="carouselImg">
                    </div>
                    ${navHtml}
                    ${dotsHtml}
                    ${thumbsHtml}
                </div>
                <div class="article-body">${content}</div>
            </article>
        `;
    }

    function goSlide(i) {
        const a = currentArticle;
        const images = a.images && a.images.length ? a.images : [a.cover];
        carouselIndex = (i + images.length) % images.length;
        const img = document.getElementById('carouselImg');
        if (img) img.src = images[carouselIndex];
        document.querySelectorAll('.carousel-dots button').forEach((b, idx) => {
            b.classList.toggle('active', idx === carouselIndex);
        });
        document.querySelectorAll('.carousel-thumbs button').forEach((b, idx) => {
            b.classList.toggle('active', idx === carouselIndex);
        });
    }
    function prevSlide() { goSlide(carouselIndex - 1); }
    function nextSlide() { goSlide(carouselIndex + 1); }

    function showNotFound() {
        const container = document.getElementById('articleContainer');
        container.innerHTML = `<div class="article-error">
            <p>${translations[currentLang].article_not_found}</p>
            <p style="margin-top:16px;"><a href="news.html">${translations[currentLang].back_to_news_link}</a></p>
        </div>`;
    }

    async function loadArticle() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (!id) { showNotFound(); return; }
            const res = await fetch('data/news.json');
            const data = await res.json();
            allArticles = data.articles || [];
            currentArticle = allArticles.find(a => a.id === id);
            if (!currentArticle) { showNotFound(); return; }
            renderArticle();
        } catch (e) {
            document.getElementById('articleContainer').innerHTML = `<div class="article-error">加载失败</div>`;
        }
    }

    async function loadFriendLinks() {
        try {
            if (!friendLinksCache) {
                const res = await fetch('data/support.json');
                friendLinksCache = (await res.json()).support.friendLinks;
            }
            const row = document.getElementById('friendLinksRow');
            if (row && friendLinksCache) {
                row.innerHTML = friendLinksCache.map(link => {
                    const name = currentLang === 'en' && link.name_en ? link.name_en : link.name;
                    return `<a href="${link.url}" target="_blank">${name}</a>`;
                }).join('');
            }
        } catch (e) { console.error(e); }
    }

    document.addEventListener('click', function(event) {
            const navLinks = document.getElementById('navLinks');
            const nav = document.querySelector('nav');
            
            if (navLinks.classList.contains('active')) {
                if (!nav.contains(event.target) || (event.target.closest('a') && !event.target.closest('.nav-links'))) {
                    navLinks.classList.remove('active');
                }
            }
        });

        window.addEventListener('scroll', function() {
            const nav = document.querySelector('nav');
            nav.classList.toggle('scrolled', window.scrollY > 0);
        });

    initTheme();

    loadSharedTranslations().then(() => {
        initLanguage();
        loadArticle();
    });
</script>
</body>
</html>
